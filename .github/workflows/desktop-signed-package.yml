name: Desktop signed-component package
run-name: Desktop package ${{ inputs.tag }} / ${{ inputs.platform }} / ${{ inputs.handoff_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published vX.Y.Z release"
        required: true
        type: string
      commit:
        description: "Exact tagged commit from the pre-build manifest"
        required: true
        type: string
      platform:
        description: "Signed component platform"
        required: true
        type: choice
        options:
          - macos-aarch64
          - windows-x64
      handoff_id:
        description: "Unique internal handoff identifier"
        required: true
        type: string
      handoff_url:
        description: "HTTPS OSS URL for the signed component archive"
        required: true
        type: string
      handoff_sha256:
        description: "SHA-256 of the signed component archive"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-signed-package-${{ inputs.tag }}-${{ inputs.platform }}-${{ inputs.handoff_id }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ inputs.platform }} signed components
    runs-on: ${{ inputs.platform == 'macos-aarch64' && 'macos-latest' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Desktop versions follow the Python package
        run: python desktop/scripts/sync_version.py --check
      - name: Validate immutable release identity and handoff URL
        shell: bash
        env:
          HANDOFF_URL: ${{ inputs.handoff_url }}
          HANDOFF_SHA256: ${{ inputs.handoff_sha256 }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git describe --tags --exact-match HEAD | grep -Fx "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python desktop/scripts/prepare_github_release.py validate-tag --tag "$RELEASE_TAG"
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["HANDOFF_URL"])
          prefix = "/github-releases/aliyun/iac-code/desktop/staging/"
          if parsed.scheme != "https" or parsed.netloc != "ros-public-tools.oss-cn-beijing.aliyuncs.com":
              raise SystemExit("signed handoff must use the configured public OSS origin")
          if not parsed.path.startswith(prefix) or parsed.query or parsed.fragment:
              raise SystemExit("signed handoff URL is outside the Desktop staging prefix")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ["HANDOFF_SHA256"]):
              raise SystemExit("signed handoff SHA-256 is invalid")
          PY
      - name: Download and verify signed component handoff
        shell: bash
        env:
          HANDOFF_URL: ${{ inputs.handoff_url }}
          HANDOFF_SHA256: ${{ inputs.handoff_sha256 }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 "$HANDOFF_URL" --output signed-components.zip
          actual="$(python -c 'import hashlib; print(hashlib.sha256(open("signed-components.zip", "rb").read()).hexdigest())')"
          test "$actual" = "$HANDOFF_SHA256"
      - name: Normalize version argument
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Import signed components
        shell: bash
        run: >-
          python desktop/scripts/signing_handoff.py consume
          --archive signed-components.zip
          --repository "${{ github.repository }}"
          --tag "${{ inputs.tag }}"
          --version "$RELEASE_VERSION"
          --commit "${{ inputs.commit }}"
          --platform "${{ inputs.platform }}"
      - name: Install locked Tauri CLI
        run: npm ci
        working-directory: desktop
      - name: Bundle signed components without rebuilding or outer signing
        env:
          IAC_CODE_DESKTOP_UPDATER_ENDPOINT: ${{ vars.IAC_CODE_DESKTOP_UPDATER_ENDPOINT }}
          IAC_CODE_DESKTOP_UPDATER_PUBKEY: ${{ vars.IAC_CODE_DESKTOP_UPDATER_PUBKEY }}
        run: python desktop/scripts/signing_handoff.py bundle --platform "${{ inputs.platform }}"
      - name: Preserve macOS app layout for internal final signing
        if: inputs.platform == 'macos-aarch64'
        shell: bash
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          desktop/src-tauri/target/release/bundle/macos/iac-code.app
          desktop/src-tauri/target/release/bundle/macos/iac-code.app.zip
      - name: Upload macOS app layout for internal final signing
        if: inputs.platform == 'macos-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundled-macos-aarch64-${{ inputs.handoff_id }}
          path: desktop/src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows installer for internal outer signing
        if: inputs.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundled-windows-x64-${{ inputs.handoff_id }}
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
