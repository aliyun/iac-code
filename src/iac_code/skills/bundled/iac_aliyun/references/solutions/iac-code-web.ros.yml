ROSTemplateFormatVersion: '2015-09-01'
Description:
  en: Deploy one iac-code Web instance with an EIP, ECS RAM Role credentials, encrypted token transport, and a ROS-managed Bailian API key.
  zh-cn: 部署一套带 EIP、ECS RAM Role 凭证、Token 加密通道和 ROS 托管百炼 API Key 的 iac-code Web。
Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - ZoneId
          - AccessCidr
        Label:
          default: Network
      - Parameters:
          - InstanceType
          - SystemDiskCategory
          - InternetBandwidth
        Label:
          default: iac-code Web
    TemplateTags:
      - acs:solution:iac-code:iac-code-web
Parameters:
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区
    AssociationProperty: ALIYUN::ECS::ZoneId
    AssociationPropertyMetadata:
      RegionId: ${ALIYUN::Region}
  InstanceType:
    Type: String
    Label:
      en: ECS instance type
      zh-cn: ECS 实例规格
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
      InstanceChargeType: PostPaid
  SystemDiskCategory:
    Type: String
    Label:
      en: System disk category
      zh-cn: 系统盘类型
    AssociationProperty: ALIYUN::ECS::Disk::SystemDiskCategory
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
      InstanceType: ${InstanceType}
  InternetBandwidth:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
    Label:
      en: EIP bandwidth
      zh-cn: EIP 带宽
    AssociationProperty: Number
  AccessCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(?:\d{1,3}\.){3}\d{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$
    Label:
      en: Web access CIDR
      zh-cn: Web 访问网段
    AssociationProperty: String
Resources:
  Vpc:
    Type: ALIYUN::ECS::VPC
    Properties:
      CidrBlock: 192.168.0.0/16
      VpcName: iac-code-web-vpc
  VSwitch:
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VpcId:
        Ref: Vpc
      ZoneId:
        Ref: ZoneId
      CidrBlock: 192.168.1.0/24
      VSwitchName: iac-code-web-vswitch
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      VpcId:
        Ref: Vpc
      SecurityGroupName: iac-code-web-sg
      SecurityGroupIngress:
        - IpProtocol: tcp
          PortRange: 8766/8766
          SourceCidrIp:
            Ref: AccessCidr
  Instance:
    Type: ALIYUN::ECS::Instance
    Properties:
      ImageFamily: acs:alibaba_cloud_linux_3_2104_lts_x64
      InstanceType:
        Ref: InstanceType
      SecurityGroupId:
        Ref: SecurityGroup
      VSwitchId:
        Ref: VSwitch
      SystemDiskCategory:
        Ref: SystemDiskCategory
      InstanceName: iac-code-web
      IoOptimized: optimized
      AllocatePublicIP: false
  Eip:
    Type: ALIYUN::VPC::EIP
    Properties:
      Bandwidth:
        Ref: InternetBandwidth
      InstanceChargeType: Postpaid
      InternetChargeType: PayByTraffic
  EipAssociation:
    Type: ALIYUN::VPC::EIPAssociation
    Properties:
      AllocationId:
        Fn::GetAtt:
          - Eip
          - AllocationId
      InstanceId:
        Ref: Instance
  InstanceRamRole:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Sub: iac-code-web-${ALIYUN::StackId}
      Description: Managed by the iac-code Web ROS stack
      DeletionForce: true
      AssumeRolePolicyDocument:
        Version: '1'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs.aliyuncs.com
      PolicyAttachments:
        System:
          - AdministratorAccess
  InstanceRamRoleAttachment:
    Type: ALIYUN::ECS::RamRoleAttachment
    Properties:
      RamRoleName:
        Fn::GetAtt:
          - InstanceRamRole
          - RoleName
      InstanceIds:
        - Ref: Instance
  BailianApiKey:
    Type: ALIYUN::Bailian::ApiKey
    Properties:
      RegionId: cn-beijing
      Description: Managed by the iac-code Web ROS stack
      AuthSetModel:
        AuthSetMode: Custom
        AccessIps:
          - Fn::GetAtt:
              - Eip
              - EipAddress
  Bootstrap:
    Type: ALIYUN::ECS::RunCommand
    DependsOn:
      - EipAssociation
      - InstanceRamRoleAttachment
    Properties:
      InstanceIds:
        - Ref: Instance
      Type: RunShellScript
      ContentEncoding: PlainText
      Sync: true
      Timeout: 1800
      CommandContent:
        Fn::Sub:
          - |
            #!/bin/bash
            set -euo pipefail
            LOG=/var/log/iac-code-bootstrap.log
            exec 3>&1
            exec >>"$LOG" 2>&1

            dnf install -y python3.11 python3.11-pip
            install -d -m 0700 -o root -g root /root/.iac-code
            python3.11 -m venv /opt/iac-code/venv
            /opt/iac-code/venv/bin/pip install --upgrade --index-url https://mirrors.aliyun.com/pypi/simple/ "iac-code[http]"

            TOKEN_FILE=/root/.iac-code/web-access.token
            if [ -f "$TOKEN_FILE" ]; then
              TOKEN=$(/opt/iac-code/venv/bin/python -c 'import base64,pathlib; p=pathlib.Path("/root/.iac-code/web-access.token"); t=p.read_text("ascii").strip(); d=base64.urlsafe_b64decode(t+"="*((4-len(t)%4)%4)); assert len(d)>=32 and base64.urlsafe_b64encode(d).decode().rstrip("=")==t; print(t,end="")')
            else
              TOKEN=$(/opt/iac-code/venv/bin/python -c 'import secrets; print(secrets.token_urlsafe(32),end="")')
              TOKEN_TMP="$TOKEN_FILE.tmp"
              umask 077
              printf '%s' "$TOKEN" >"$TOKEN_TMP"
              chmod 0600 "$TOKEN_TMP"
              mv -f "$TOKEN_TMP" "$TOKEN_FILE"
            fi
            chmod 0600 "$TOKEN_FILE"

            BAILIAN_API_KEY=$(printf '%s' '${BailianApiKeyB64}' | base64 -d)
            export BAILIAN_API_KEY
            /opt/iac-code/venv/bin/python <<'PY'
            import os
            import pathlib
            import tempfile
            import yaml

            root = pathlib.Path('/root/.iac-code')
            updates = {
                root / '.credentials.yml': {'dashscope': os.environ['BAILIAN_API_KEY']},
                root / '.cloud-credentials.yml': {
                    'aliyun': {
                        'mode': 'EcsRamRole',
                        'region_id': '${StackRegion}',
                        'ram_role_name': '${InstanceRamRoleName}',
                    }
                },
                root / 'settings.yml': {
                    'activeProvider': 'dashscope',
                    'memory': {'autoMemory': True},
                    'pipeline': {'sellingReviewStep': False},
                    'providers': {
                        'dashscope': {
                            'apiBase': 'https://dashscope.aliyuncs.com/compatible-mode/v1',
                            'model': 'qwen3.8-max',
                            'name': 'DashScope',
                        }
                    },
                    'sessionDefaults': {
                        'mode': 'normal',
                        'permissionMode': 'bypass_permissions',
                        'pipelineName': 'selling',
                    },
                    'ui': {'language': 'zh'},
                    'userID': '${MasterAccountId}',
                },
            }

            def merge(target, source):
                for key, value in source.items():
                    if isinstance(value, dict) and isinstance(target.get(key), dict):
                        merge(target[key], value)
                    else:
                        target[key] = value

            for path, update in updates.items():
                current = {}
                if path.exists():
                    loaded = yaml.safe_load(path.read_text(encoding='utf-8'))
                    if isinstance(loaded, dict):
                        current = loaded
                merge(current, update)
                fd, temporary = tempfile.mkstemp(prefix=path.name + '.', dir=root)
                try:
                    with os.fdopen(fd, 'w', encoding='utf-8') as stream:
                        yaml.safe_dump(current, stream, allow_unicode=True, sort_keys=False)
                        stream.flush()
                        os.fsync(stream.fileno())
                    os.chmod(temporary, 0o600)
                    os.replace(temporary, path)
                finally:
                    if os.path.exists(temporary):
                        os.unlink(temporary)
            PY
            unset BAILIAN_API_KEY

            AGENTS_FILE=/root/AGENTS.md
            AGENTS_TMP="$AGENTS_FILE.tmp"
            umask 077
            cat >"$AGENTS_TMP" <<'AGENTS'
            # 本机 ECS 运行环境

            iac-code Web 直接运行在下述阿里云 ECS 实例上。除非用户明确指定其他机器或资源，
            用户提到的“本机”“这台机器”“当前服务器”“当前 ECS”均指此实例。

            ## 实例身份

            - 云产品：Alibaba Cloud ECS
            - 实例 ID：`${LocalInstanceId}`
            - 实例名称：`iac-code-web`
            - 实例规格：`${LocalInstanceType}`
            - 操作系统：Alibaba Cloud Linux 3
            - 地域：`${StackRegion}`
            - 可用区：`${LocalZoneId}`
            - VPC ID：`${LocalVpcId}`
            - VSwitch ID：`${LocalVSwitchId}`
            - 安全组 ID：`${LocalSecurityGroupId}`
            - 公网 EIP：`${LocalEipAddress}`
            - 当前用户：`root`
            - ECS 详情页：<https://ecs.console.aliyun.com/#/server/region/${StackRegion}?instanceIds=${LocalInstanceId}>

            ## 操作约定

            - “查询/查看 ECS 信息”默认查询上述实例。需要云上控制面属性时，使用地域 `${StackRegion}`
              和实例 ID `${LocalInstanceId}` 精确查询；需要实时操作系统状态时，直接检查本机。
            - “安装 nginx”或其他未指定目标的系统运维请求默认在本机执行。Alibaba Cloud Linux 3
              使用 `dnf` 和 `systemctl`，执行后说明实际变更与服务状态。
            - “查看机器负载”默认检查本机的 CPU、内存、磁盘和 load average，并报告采集时间。
            - “跳转/打开 ECS 详情页”时，直接返回上面的 ECS 详情页链接，不要返回通用实例列表页。
            - 实例 ID、地域和网络资源 ID 是部署时身份；负载、IP 绑定、运行状态等动态信息应实时核验。
            - 不得输出 API Key、访问令牌、凭据文件内容或 ECS 元数据服务中的 RAM 角色临时凭据。
            - 停止、重启、释放本 ECS，停止 `iac-code-web`，或者修改其网络与安全组可能中断当前 Web；
              执行这些操作前必须获得用户明确确认。
            AGENTS
            chmod 0600 "$AGENTS_TMP"
            mv -f "$AGENTS_TMP" "$AGENTS_FILE"

            cat >/etc/systemd/system/iac-code-web.service <<'UNIT'
            [Unit]
            Description=iac-code Web
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=root
            Group=root
            WorkingDirectory=/root
            Environment=IAC_CODE_CONFIG_DIR=/root/.iac-code
            ExecStart=/opt/iac-code/venv/bin/iac-code web --host 0.0.0.0 --port 8766 --access-token-file /root/.iac-code/web-access.token --no-open
            Restart=on-failure

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now iac-code-web
            for ATTEMPT in $(seq 1 60); do
              curl --fail --silent http://127.0.0.1:8766/health >/dev/null && break
              [ "$ATTEMPT" -eq 60 ] && exit 1
              sleep 2
            done
            printf '%s' "$TOKEN" >&3
          - BailianApiKeyB64:
              Fn::Base64Encode:
                Fn::GetAtt:
                  - BailianApiKey
                  - Key
            MasterAccountId:
              Ref: ALIYUN::TenantId
            StackRegion:
              Ref: ALIYUN::Region
            InstanceRamRoleName:
              Fn::GetAtt:
                - InstanceRamRole
                - RoleName
            LocalInstanceId:
              Ref: Instance
            LocalInstanceType:
              Ref: InstanceType
            LocalZoneId:
              Ref: ZoneId
            LocalVpcId:
              Ref: Vpc
            LocalVSwitchId:
              Ref: VSwitch
            LocalSecurityGroupId:
              Ref: SecurityGroup
            LocalEipAddress:
              Fn::GetAtt:
                - Eip
                - EipAddress
Outputs:
  PublicUrl:
    Label:
      en: Public URL
      zh-cn: 公网访问地址
    Value:
      Fn::Sub:
        - http://${EipAddress}:8766
        - EipAddress:
            Fn::GetAtt:
              - Eip
              - EipAddress
  WebAccessToken:
    Label:
      en: Web access token
      zh-cn: Web 访问 Token
    Value:
      Fn::Base64Decode:
        Fn::Jq:
          - First
          - .[0].Output
          - Fn::GetAtt:
              - Bootstrap
              - InvokeResults
  InstanceId:
    Label:
      en: ECS instance ID
      zh-cn: ECS 实例 ID
    Value:
      Ref: Instance
  EipAddress:
    Label:
      en: EIP address
      zh-cn: EIP 地址
    Value:
      Fn::GetAtt:
        - Eip
        - EipAddress
