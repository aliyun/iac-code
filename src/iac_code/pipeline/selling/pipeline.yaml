name: selling
emit_stack_events: true

# --- User escape 门控（控制 pipeline 运行中用户能否绕开走 chat 之外的路径）---
# 三个开关默认 false（不声明也一样），pipeline 完全主导对话。
# 声明 true 才允许对应触发器。
allow_user_escapes:
  skill: false      # 控制 $skill_name <prompt>
  command: false    # 控制 /xxx（白名单 /exit /help /status /resume 永远可用）
  shell: false      # 控制 !cmd

on_complete:
  action: switch_to_normal
  apply_on:
    - completed
    - early_exit
    - failed
    - canceled
  handoff_context:
    include:
      - intent
      - architecture
      - evaluated_candidates
      - selected_plan
      - deployment

# --- Base Prompt Sections ---
# 控制注入到每个 step system prompt 前的通用 section。
# 可用 section: identity, system, env, cloud_config, tools, runtime_context, doing_tasks, actions, output_style
# 解析规则: include 为空 = 全部可用 section; exclude 从中移除指定项。
# 不配置此字段时，默认: [identity, system, env, cloud_config, tools, runtime_context]
# Step 级同名字段可覆盖（整体替换，非合并）。
base_prompt_sections:
  include: [identity, system, env, cloud_config, tools, runtime_context, doing_tasks, actions, output_style]
  exclude: []

feature_flags:
  enable_reviewing:
    default: false
    env: IAC_CODE_PIPELINE_SELLING_ENABLE_REVIEWING
    display_key: review_step

prerequisites:
  infraguard:
    command: infraguard
    required_by_flags: [enable_reviewing]
    on_missing:
      repl: prompt_install
      web: prompt_install
      non_interactive: disable_feature
    version_check:
      command: [infraguard, version]
      minimum: "0.10.1"
      pattern: 'InfraGuard:\s*(?P<version>\d+\.\d+\.\d+)'
      timeout_seconds: 30
    installers:
      - id: direct-binary
        display_key: direct_binary_download
        platforms: [darwin, linux, windows]
        download:
          install_dir: ~/bin
          installed_name: infraguard
          timeout_seconds: 1800
          assets:
            - platforms: [darwin]
              architectures: [arm64]
              filename: infraguard-v0.10.1-darwin-arm64
              sha256: cda2ba2eab1076a5f8b6c66654295a9b9aa8e9b302407e9580a4d75b7872b76f
              urls:
                - env: IAC_CODE_INFRAGUARD_DARWIN_ARM64_URL
                - https://ros-public-tools.oss-cn-beijing.aliyuncs.com/github-releases/aliyun/infraguard/0.10.1/infraguard-v0.10.1-darwin-arm64
                - https://github.com/aliyun/infraguard/releases/download/v0.10.1/infraguard-v0.10.1-darwin-arm64
            - platforms: [darwin]
              architectures: [amd64]
              filename: infraguard-v0.10.1-darwin-amd64
              sha256: d9e8963250de8a13bbe4a6e9e528ad638f6b8fb4ad6928e2bfc27771a1db3260
              urls:
                - env: IAC_CODE_INFRAGUARD_DARWIN_AMD64_URL
                - https://ros-public-tools.oss-cn-beijing.aliyuncs.com/github-releases/aliyun/infraguard/0.10.1/infraguard-v0.10.1-darwin-amd64
                - https://github.com/aliyun/infraguard/releases/download/v0.10.1/infraguard-v0.10.1-darwin-amd64
            - platforms: [linux]
              architectures: [amd64]
              filename: infraguard-v0.10.1-linux-amd64
              sha256: a0f66d5390df1746b10bdd0e87dfe68b6418c22d43add22a4ca9cc99f22ef66b
              urls:
                - env: IAC_CODE_INFRAGUARD_LINUX_AMD64_URL
                - https://ros-public-tools.oss-cn-beijing.aliyuncs.com/github-releases/aliyun/infraguard/0.10.1/infraguard-v0.10.1-linux-amd64
                - https://github.com/aliyun/infraguard/releases/download/v0.10.1/infraguard-v0.10.1-linux-amd64
            - platforms: [linux]
              architectures: [arm64]
              filename: infraguard-v0.10.1-linux-arm64
              sha256: 5d929b89ff6ef5e8d6cd95ce3d84cb1747452f055706037b972463126065e262
              urls:
                - env: IAC_CODE_INFRAGUARD_LINUX_ARM64_URL
                - https://ros-public-tools.oss-cn-beijing.aliyuncs.com/github-releases/aliyun/infraguard/0.10.1/infraguard-v0.10.1-linux-arm64
                - https://github.com/aliyun/infraguard/releases/download/v0.10.1/infraguard-v0.10.1-linux-arm64
            - platforms: [windows]
              architectures: [amd64]
              filename: infraguard-v0.10.1-windows-amd64.exe
              sha256: 48dd98cec9cc825fd273280e3ca8502fc65ab31170394b18d6e388ccb4c80332
              urls:
                - env: IAC_CODE_INFRAGUARD_WINDOWS_AMD64_URL
                - https://ros-public-tools.oss-cn-beijing.aliyuncs.com/github-releases/aliyun/infraguard/0.10.1/infraguard-v0.10.1-windows-amd64.exe
                - https://github.com/aliyun/infraguard/releases/download/v0.10.1/infraguard-v0.10.1-windows-amd64.exe
            - platforms: [windows]
              architectures: [arm64]
              filename: infraguard-v0.10.1-windows-arm64.exe
              sha256: 7ab067e0af3e59173bf04d8a2624a2cf6b42eda0fe578bc0be2540394d49636e
              urls:
                - env: IAC_CODE_INFRAGUARD_WINDOWS_ARM64_URL
                - https://ros-public-tools.oss-cn-beijing.aliyuncs.com/github-releases/aliyun/infraguard/0.10.1/infraguard-v0.10.1-windows-arm64.exe
                - https://github.com/aliyun/infraguard/releases/download/v0.10.1/infraguard-v0.10.1-windows-arm64.exe
    post_install:
      timeout_seconds: 300
      commands:
        - [infraguard, policy, update]

context_dependencies:
  intent: []
  architecture: [intent]
  evaluated_candidates: [architecture]
  selected_plan: [evaluated_candidates]
  deployment: [intent, selected_plan]

max_rollbacks: 3

# --- Tools 配置说明 ---
# tools.include: 为空 = 全量 base 工具; 有值 = 仅指定工具
# tools.exclude: 从结果集中移除
# complete_step 工具始终自动注入，无需手动声明
# 不配置 tools = 全量 base 工具

sub_pipelines:
  evaluate_candidate:
    max_rollbacks: 5
    context_fields_from_parent: [intent]
    iterate_over: architecture.candidates
    steps:
      - id: template_generating
        description: "根据候选架构生成 IaC 模板代码"
        conclusion_field: template
        a2a_artifacts:
          - path: conclusion.file_path
            content: conclusion.template
            media_type: auto
            supersedes_path: conclusion.file_path
        forward: reviewing
        skill: iac-aliyun-template-generating
        prompt: prompts/template_generating.md
        context_fields: [candidate]
        tools:
          include: []
          exclude: [write_memory, ros_stack, ros_stack_instances]
        inject_tools: [ros_validate_template]

      - id: reviewing
        description: "审查模板的安全性和最佳实践"
        enabled_when: enable_reviewing
        conclusion_field: template
        forward: cost_estimating
        skill: iac-aliyun-review
        prompt: prompts/reviewing.md
        context_fields: [intent, candidate, template]
        a2a_artifacts:
          - path: conclusion.file_path
            content: conclusion.template
            media_type: auto
            role: final
            supersedes_path: conclusion.file_path
        config:
          infraguard:
            mode: static
            aspects:
              security:
                name: "安全性"
                selection_guidance: "包含公网入口、安全组、访问控制、身份权限或任何可被外部访问的资源时选择；安全基线通常默认选择。"
                policies:
                  - pack:aliyun:security
              high_availability:
                name: "高可用"
                selection_guidance: "用户要求生产级、容灾、多可用区、SLA，或 candidate 明确设计为高可用方案时选择；低成本单机方案通常跳过。"
                policies:
                  - pack:aliyun:high-availability
              cost_optimization:
                name: "成本优化"
                selection_guidance: "用户有预算约束、低成本偏好，或方案包含可能闲置/过期的资源时选择。"
                policies:
                  - pack:aliyun:cost-optimization
              compliance:
                name: "合规性"
                selection_guidance: "用户提出行业合规、等保、审计、企业治理或监管要求时选择；普通实验/个人项目通常跳过。"
                policies:
                  - pack:aliyun:compliance
              best_practice:
                name: "最佳实践"
                selection_guidance: "所有可部署 ROS 模板的通用质量基线，通常默认选择。"
                policies:
                  - pack:aliyun:best-practice
              operations:
                name: "可运维性"
                selection_guidance: "生产环境、长期运行服务，或需要变更管理、备份、稳定性保障时选择。"
                policies:
                  - pack:aliyun:operations
              network_architecture:
                name: "网络架构"
                selection_guidance: "模板包含 VPC、VSwitch、SLB/ALB、EIP、公网访问、跨资源网络路径或网络隔离要求时选择。"
                policies:
                  - pack:aliyun:network-architecture
              elasticity:
                name: "弹性能力"
                selection_guidance: "用户提到突发流量、秒杀、自动扩缩容，或方案包含弹性伸缩/负载均衡/动态容量设计时选择。"
                policies:
                  - pack:aliyun:elasticity
            ignore_waivers: true
            max_fix_rounds: 5
            blocking_severities: [critical, high]
        completion_guards:
          - when_conclusion_field_equals:
              validated: true
            when_tool_result_exists:
              tools: [write_file, edit_file]
              match_conclusion_field: file_path
              match_result_field: result.file_path
            require_tool_result:
              tool: ros_validate_template
              match_conclusion_field: file_path
              match_result_field: input.template_url
              disallow_tool_results_after_match:
                - tools: [write_file, edit_file]
                  match_conclusion_field: file_path
                  match_result_field: result.file_path
                  message_key: reviewing_rerun_after_validate_template_write
            message_key: reviewing_validate_template_required
          - when_conclusion_field_equals:
              review_passed: true
            require_tool_result:
              tool: infraguard_scan
              latest_match: true
              match_conclusion_field: file_path
              match_result_field: file_path
              match_fields:
                - conclusion_field: template_sha256
                  result_field: file_sha256
              result_field_equals:
                passed: true
                blocking_findings: 0
              required_result_fields: [file_content, file_sha256, selected_aspects, expanded_policies]
              disallow_tool_results_after_match:
                - tools: [write_file, edit_file]
                  match_conclusion_field: file_path
                  match_result_field: result.file_path
                  message_key: reviewing_rerun_after_final_infraguard_write
            require_conclusion_sha256:
              content_field: template
              sha256_field: template_sha256
            message_key: reviewing_final_infraguard_required
          - when_conclusion_field_equals:
              review_passed: true
            when_tool_result_exists:
              tools: [write_file, edit_file]
              match_conclusion_field: file_path
              match_result_field: result.file_path
            require_tool_result:
              tool: infraguard_scan
              latest_match: true
              after_tool_result:
                tool: ros_validate_template
                match_conclusion_field: file_path
                match_result_field: input.template_url
              match_conclusion_field: file_path
              match_result_field: file_path
              match_fields:
                - conclusion_field: template_sha256
                  result_field: file_sha256
              result_field_equals:
                passed: true
                blocking_findings: 0
              required_result_fields: [file_content, file_sha256, selected_aspects, expanded_policies]
              disallow_tool_results_after_match:
                - tools: [write_file, edit_file]
                  match_conclusion_field: file_path
                  match_result_field: result.file_path
                  message_key: reviewing_rerun_after_final_infraguard_write
            message_key: reviewing_final_infraguard_required
        conclusion_schema:
          type: object
          required:
            - template
            - template_sha256
            - file_path
            - region
            - description
            - validated
            - review_passed
            - review_issues
            - selected_review_aspects
            - skipped_review_aspects
            - resolved_infraguard_policies
            - infraguard_summary
            - fix_summary
          additionalProperties: false
          properties:
            template:
              type: string
            template_sha256:
              type: string
            file_path:
              type: string
            region:
              type: string
            description:
              type: string
            validated:
              const: true
            review_passed:
              const: true
            review_issues:
              type: array
            selected_review_aspects:
              type: array
            skipped_review_aspects:
              type: array
            resolved_infraguard_policies:
              type: array
            infraguard_summary:
              type: object
            fix_summary:
              type: string
        tools:
          include: [read_file, write_file, edit_file, grep, infraguard_scan, ros_validate_template, aliyun_doc_search, aliyun_api_doc, web_fetch, aliyun_api]
          exclude: [write_memory]
        inject_tools: [ros_validate_template]

      - id: cost_estimating
        description: "评估模板的资源成本"
        conclusion_field: cost
        forward: null
        skill: iac-aliyun-cost
        prompt: prompts/cost_estimating.md
        context_fields: [template]
        tools:
          include: []
          exclude: [bash, write_memory, ros_stack, ros_stack_instances]
        inject_tools:
          - ros_validate_template
          - ros_get_template_parameter_constraints
          - ros_preview_template
          - ros_estimate_template_cost

steps:
  - id: intent_parsing
    description: "解析用户意图，提取云服务需求和约束条件"
    conclusion_field: intent
    forward: architecture_planning
    skill: iac-aliyun-intent
    prompt: prompts/intent_parsing.md
    exit_condition:
      field: is_infra_intent
      value: false
    tools:
      include: [read_memory]
      exclude: []
    inject_tools: [ask_user_question]
    completion_guards:
      - require_tool: ask_user_question
        when_user_message_matches_any:
          - "(项目|需求|应用|服务|网站|小程序|后端).*(上线|部署)"
          - "(上线|部署).*(项目|需求|应用|服务|网站|小程序|后端)"
          - "(做|建|搭建|开发).*(网站|应用|小程序|后端)"
        unless_user_message_matches_any:
          - "(ECS|RDS|OSS|VPC|SLB|ALB|NAT|Redis|Kafka|CDN|K8s|Kubernetes|阿里云|AWS|Azure|GCP|服务器|数据库|负载均衡|容器)"
        required_conclusion_any_of: [clarification_choice, clarification_text]
        copy_tool_result_to_conclusion:
          selected_id: clarification_choice
          free_text: clarification_text
        message_key: intent_cloud_resource_clarification_required
      - require_tool: ask_user_question
        when_user_message_matches_any:
          - '(?<![A-Za-z0-9])(AWS|Amazon Web Services|Azure|GCP|Google Cloud|GoogleCloud|UCloud|EC2|S3|Lambda|CloudFormation|EKS|AKS|GKE)(?![A-Za-z0-9])|腾讯云|华为云|火山引擎'
        required_conclusion_any_of: [clarification_choice, clarification_text]
        copy_tool_result_to_conclusion:
          selected_id: clarification_choice
          free_text: clarification_text
        message_key: intent_alibaba_cloud_only
      - require_tool: ask_user_question
        when_conclusion_field_equals:
          confidence: low
        required_conclusion_any_of: [clarification_choice, clarification_text]
        copy_tool_result_to_conclusion:
          selected_id: clarification_choice
          free_text: clarification_text
        message_key: intent_low_confidence_clarification_required
      - require_tool: ask_user_question
        when_conclusion_field_equals:
          category: chat
        required_conclusion_any_of: [clarification_choice, clarification_text]
        copy_tool_result_to_conclusion:
          selected_id: clarification_choice
          free_text: clarification_text
        message_key: intent_not_deployment_request
      - require_tool: ask_user_question
        when_conclusion_field_equals:
          category: code_request
        required_conclusion_any_of: [clarification_choice, clarification_text]
        copy_tool_result_to_conclusion:
          selected_id: clarification_choice
          free_text: clarification_text
        message_key: intent_not_deployment_request
      - require_tool: ask_user_question
        when_conclusion_field_equals:
          category: knowledge_question
        required_conclusion_any_of: [clarification_choice, clarification_text]
        copy_tool_result_to_conclusion:
          selected_id: clarification_choice
          free_text: clarification_text
        message_key: intent_not_deployment_request
    base_prompt_sections:
      include: [identity, system, env, cloud_config, runtime_context, output_style]
      exclude: []

  - id: architecture_planning
    description: "根据意图设计多个候选架构方案"
    conclusion_field: architecture
    forward: evaluate_candidates
    skill: iac-aliyun-architecture
    prompt: prompts/architecture_planning.md
    context_fields: [intent]
    tools:
      include: [read_memory, read_file, list_files, glob, grep, web_fetch, aliyun_doc_search]
      exclude: []

  - id: evaluate_candidates
    description: "并行生成各候选方案的 IaC 模板并评估成本"
    type: parallel_sub_pipeline
    sub_pipeline: evaluate_candidate
    conclusion_field: evaluated_candidates
    forward: confirm_and_select
    prompt: prompts/evaluate_candidates.md

  - id: confirm_and_select
    description: "展示方案详情，等待用户选择"
    conclusion_field: selected_plan
    forward: deploying
    prompt: prompts/confirm_and_select.md
    context_fields: [evaluated_candidates]
    auto_advance: false
    ui_mode: candidate_selection
    inject_tools: [show_architecture_diagram, show_candidate_detail]
    surface_overrides:
      a2a:
        prompt: prompts/confirm_and_select.a2a.md
        inject_tools: []
    tools:
      include: [complete_step]
      exclude: []
    conclusion_schema:
      type: object
      required: [user_prompt, options]
      additionalProperties: false
      properties:
        user_prompt:
          type: string
          description: 展示给用户的选择提示
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, summary, candidate_index]
            additionalProperties: false
            properties:
              name:
                type: string
              summary:
                type: string
              candidate_index:
                type: integer
        user_input:
          type: string
          description: 用户选择方案时输入的原始文本；首次展示方案时可省略
        selected_candidate_name:
          type: string
          description: 用户最终选择的候选方案名称；首次展示方案时可省略
        selected_candidate_index:
          type: integer
          description: 用户最终选择的候选方案在本次 options 列表中的 0 基顺序；首次展示方案时可省略
        selected_evaluated_candidate_index:
          type: integer
          description: 用户最终选择的候选方案在 evaluated_candidates 中的 0 基下标，存在时优先于 selected_candidate_index；首次展示方案时可省略
        parameter_overrides:
          type: object
          description: 用户选择方案时传入的部署参数覆盖字典；键为 ROS Parameters 名称，值为用户指定的部署参数值；首次展示方案时可省略

  - id: deploying
    description: "执行用户选定方案的部署"
    conclusion_field: deployment
    forward: null
    skill: iac-aliyun-deploying
    prompt: prompts/deploying.md
    interrupt_judge_failure: pause
    context_fields: [intent, selected_plan, evaluated_candidates]
    hooks_file: hooks/deploying.py
    completion_guards:
      - when_conclusion_field_equals:
          status: success
        required_conclusion_field: stack_id
        require_tool_result:
          tool: ros_deploy
          action_in: [create, continue_create, delete_and_create, wait]
          is_success: true
          status_in: [CREATE_COMPLETE]
          match_conclusion_field: stack_id
        message_key: deploy_wait_create_complete
    tools:
      include: []
      exclude: [write_memory, write_file, ros_stack, ros_stack_instances]
    inject_tools: [ros_validate_template, ros_get_template_parameter_constraints, ros_deploy]
